name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The 'no unreleased skeleton changes' check walks back to the
          # commit that last touched VERSION. A shallow clone cannot see it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run static validator
        run: python3 scripts/validate.py
